# =============================================================================
# PIN-diode junction-cooling package -- base parameters (spec §5.1)
# SINGLE SOURCE OF TRUTH.  comsol/params.txt is generated from this file by
#     python comsol/python/write_params_txt.py
# and tests/test_postprocess.py::test_params_txt_in_sync fails if they diverge.
#
# Each entry: name: [COMSOL expression, description]
# Expressions use COMSOL syntax (units in square brackets, k_B_const, e_const,
# log = natural logarithm).  Order matters: later entries may reference earlier.
# =============================================================================
parameters:
  T0:          ["300[K]",                "Lattice/reference temperature (semiconductor)"]
  T_room:      ["300[K]",                "Room reservoir temperature"]
  dT_sink:     ["0[K]",                  "Sink minus room temperature (Config A sweep)"]
  T_out:       ["300[K]",                "Ambient for lateral sink (Config C)"]
  Wn:          ["2[um]",                 "n+ thickness"]
  Wp:          ["2[um]",                 "p+ thickness"]
  Wi:          ["1[mm]",                 "intrinsic length"]
  Ltot:        ["Wn+Wi+Wp",              "total length"]
  Xc:          ["Ltot/2",                "centre"]
  Nd_p:        ["1e19[1/cm^3]",          "n+ donor peak"]
  Na_p:        ["1e19[1/cm^3]",          "p+ acceptor peak"]
  N_bg:        ["1e12[1/cm^3]",          "i-region background acceptors"]
  l_dec:       ["0.1[um]",               "Gaussian decay length"]
  tau_long:    ["1[ms]",                 "SRH lifetime, high-purity Si"]
  tau_short:   ["1[us]",                 "SRH lifetime in recombination zone"]
  w_rz:        ["100[um]",               "recombination-zone width"]
  rz_on:       ["0",                     "0 = uniform lifetime, 1 = engineered zone"]
  Cn_aug:      ["2.8e-31[cm^6/s]",       "Auger, electrons (Dziewior & Schmid 1977)"]
  Cp_aug:      ["9.9e-32[cm^6/s]",       "Auger, holes"]
  Ac:          ["1[mm^2]",               "cross-sectional area"]
  k_Si:        ["148[W/(m*K)]",          "thermal conductivity"]
  rho_Si:      ["2329[kg/m^3]",          "density"]
  Cp_Si:       ["700[J/(kg*K)]",         "heat capacity"]
  VF:          ["0.7[V]",                "forward bias (swept)"]
  Nc_si:       ["2.86e19[1/cm^3]",       "for Pi calc (overwrite with library value)"]
  Nv_si:       ["3.10e19[1/cm^3]",       "for Pi calc (overwrite with library value)"]
  Pi_nc:       ["k_B_const*T0/e_const*(log(Nc_si/Nd_p)+2)", "n-contact Peltier coefficient (approx 0.079 V)"]
  Pi_pc:       ["k_B_const*T0/e_const*(log(Nv_si/Na_p)+2)", "p-contact Peltier coefficient (approx 0.081 V)"]
  h_lat:       ["1e4[W/(m^2*K)]",        "lateral heat-transfer coefficient (Config C)"]
  Plat_over_A: ["4000[1/m]",             "perimeter/area of 1 mm x 1 mm bar"]
  w_wall:      ["50[um]",                "insulated wall length next to each junction (Config C)"]
  mesh_factor: ["1",                     "mesh refinement multiplier"]

# Spec §5.2 -- functions and variables (component level)
functions:
  rect1:
    type: Rectangle
    lower: "Xc-w_rz/2"
    upper: "Xc+w_rz/2"
    smooth: "10[um]"       # size of transition zone
    argument: x

variables:
  tau_x:    ["1/(1/tau_long + rz_on*rect1(x)/tau_short)", "SRH lifetime (rates combined)"]
  lat_mask: ["(abs(x-Xc) < (Wi/2 - w_wall))",            "Config C lateral-sink mask"]

# Spec §4.2 fallback material (used when the library material is not loaded)
material_fallback:
  relpermittivity: "11.7"
  Eg0:  "1.12[V]"
  chi0: "4.05[V]"
  Nc:   "2.86e19[1/cm^3]*(T/300[K])^1.5"
  Nv:   "3.10e19[1/cm^3]*(T/300[K])^1.5"
  mun:  "1448[cm^2/(V*s)]"
  mup:  "473[cm^2/(V*s)]"
  thermalconductivity: "k_Si"
  density: "rho_Si"
  heatcapacity: "Cp_Si"

# Spec §4.3 option M2 (Caughey-Thomas, user-defined low-field mobility)
mobility_M2:
  electrons: {mu_min: "68.5[cm^2/(V*s)]", mu_max: "1414[cm^2/(V*s)]",  N_ref: "9.20e16[1/cm^3]", alpha: "0.711"}
  holes:     {mu_min: "44.9[cm^2/(V*s)]", mu_max: "470.5[cm^2/(V*s)]", N_ref: "2.23e17[1/cm^3]", alpha: "0.719"}

# Spec §4.5 mesh
mesh:
  n_doped: 400            # elements in each doped layer
  n_ihalf: 600            # elements in each i-half
  elemratio_ihalf: 2000   # geometric, fine end at the junction

# Spec §4.6 sweeps
sweeps:
  VF_iv:    "range(0,0.025,0.9)"      # Study 1, 3, 4
  VF_room:  "range(0,0.025,0.8)"      # Study 2
  dT_sink:  "range(-0.02,0.0025,0.02)"  # Study 2 parametric
  rtol: 1e-6
  profile_VF: [0.0, 0.6, 0.7, 0.75, 0.8]

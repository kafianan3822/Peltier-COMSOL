# =============================================================================
# PIN-diode junction-cooling package -- base parameters, GERMANIUM device
# SINGLE SOURCE OF TRUTH.  comsol/params.txt is generated from this file by
#     python comsol/python/write_params_txt.py
# and tests/test_postprocess.py::test_params_txt_in_sync fails if they diverge.
#
# Each entry: name: [COMSOL expression, description]
# Expressions use COMSOL syntax (units in square brackets, k_B_const, e_const,
# log = natural logarithm).  Order matters: later entries may reference earlier.
#
# Material values are for Ge at 300 K.  Source and justification of every value:
# docs/GERMANIUM_PARAMETERS.md.
# =============================================================================
parameters:
  T0:          ["300[K]",                "Lattice/reference temperature (semiconductor)"]
  T_room:      ["300[K]",                "Room reservoir temperature"]
  dT_sink:     ["0[K]",                  "Sink minus room temperature (Config A sweep)"]
  T_out:       ["300[K]",                "Ambient for lateral sink (Config C)"]
  Wn:          ["2[um]",                 "n+ thickness"]
  Wp:          ["2[um]",                 "p+ thickness"]
  Wi:          ["1[mm]",                 "intrinsic length"]
  Ltot:        ["Wn+Wi+Wp",              "total length"]
  Xc:          ["Ltot/2",                "centre"]
  Nd_p:        ["1e19[1/cm^3]",          "n+ donor peak (= Nc of Ge: degenerate, see V2a/V2b)"]
  Na_p:        ["1e19[1/cm^3]",          "p+ acceptor peak (= 2 Nv of Ge: degenerate, see V2a/V2b)"]
  N_bg:        ["1e12[1/cm^3]",          "i-region background acceptors (below n_i of Ge)"]
  l_dec:       ["0.1[um]",               "Gaussian decay length"]
  tau_long:    ["1[ms]",                 "SRH lifetime, high-purity Ge"]
  tau_short:   ["1[us]",                 "SRH lifetime in recombination zone"]
  w_rz:        ["100[um]",               "recombination-zone width"]
  rz_on:       ["0",                     "0 = uniform lifetime, 1 = engineered zone"]
  Cn_aug:      ["5e-31[cm^6/s]",         "Auger, electrons (Ge: Cn+Cp about 1e-30, split equally)"]
  Cp_aug:      ["5e-31[cm^6/s]",         "Auger, holes"]
  Ac:          ["1[mm^2]",               "cross-sectional area"]
  k_th:        ["60[W/(m*K)]",           "thermal conductivity of Ge"]
  rho_m:       ["5323[kg/m^3]",          "density of Ge"]
  Cp_m:        ["320[J/(kg*K)]",         "heat capacity of Ge"]
  VF:          ["0.4[V]",                "forward bias (swept)"]
  Nc_ref:      ["1.0e19[1/cm^3]",        "Nc of Ge at T0, for Pi calc (overwritten with material value)"]
  Nv_ref:      ["5.0e18[1/cm^3]",        "Nv of Ge at T0, for Pi calc (overwritten with material value)"]
  Eg_ref:      ["0.661[V]",              "band gap of Ge at T0, for the contact recombination heat (overwritten with material value)"]
  Pi_nc:       ["k_B_const*T0/e_const*(log(Nc_ref/Nd_p)+2)", "n-contact Peltier coefficient (approx 0.052 V)"]
  Pi_pc:       ["k_B_const*T0/e_const*(log(Nv_ref/Na_p)+2)", "p-contact Peltier coefficient (approx 0.034 V)"]
  h_lat:       ["1e4[W/(m^2*K)]",        "lateral heat-transfer coefficient (Config C)"]
  Plat_over_A: ["4000[1/m]",             "perimeter/area of 1 mm x 1 mm bar"]
  w_wall:      ["50[um]",                "insulated wall length next to each junction (Config C)"]
  mesh_factor: ["1",                     "mesh refinement multiplier"]

# Spec §5.2 -- functions and variables (component level)
functions:
  rect1:
    type: Rectangle
    lower: "Xc-w_rz/2"
    upper: "Xc+w_rz/2"
    smooth: "10[um]"       # size of transition zone
    argument: x

variables:
  tau_x:    ["1/(1/tau_long + rz_on*rect1(x)/tau_short)", "SRH lifetime (rates combined)"]
  lat_mask: ["(abs(x-Xc) < (Wi/2 - w_wall))",            "Config C lateral-sink mask"]

# Material identity.  The reference model and the post-processing read Eg, Nc,
# Nv and the lattice mobilities from `material_fallback` below, so the material
# is defined in exactly one place.
material:
  name: Ge
  label: germanium
  library_file: Ge_library.mph     # optional copy of the COMSOL library material
  # Arora mobility, Slotboom band-gap narrowing and Fletcher scattering are
  # calibrated for silicon.  They are not used for Ge: base mobility is M2.
  silicon_models: false

# Explicit material table (used when the library material is not loaded)
material_fallback:
  relpermittivity: "16.2"
  Eg0:  "0.661[V]"
  chi0: "4.0[V]"
  Nc:   "1.0e19[1/cm^3]*(T/300[K])^1.5"
  Nv:   "5.0e18[1/cm^3]*(T/300[K])^1.5"
  mun:  "3900[cm^2/(V*s)]"
  mup:  "1900[cm^2/(V*s)]"
  thermalconductivity: "k_th"
  density: "rho_m"
  heatcapacity: "Cp_m"

# Mobility M2: mu = mu_min + (mu_max-mu_min)/(1+(N_tot/N_ref)^alpha).
# Ge values are the Hilsum form mu_L/(1+sqrt(N/1e17 cm^-3)): mu_min = 0, alpha = 0.5.
mobility_M2:
  electrons: {mu_min: "0[cm^2/(V*s)]", mu_max: "3900[cm^2/(V*s)]", N_ref: "1e17[1/cm^3]", alpha: "0.5"}
  holes:     {mu_min: "0[cm^2/(V*s)]", mu_max: "1900[cm^2/(V*s)]", N_ref: "1e17[1/cm^3]", alpha: "0.5"}

# Spec §4.5 mesh
mesh:
  n_doped: 400            # elements in each doped layer
  n_ihalf: 600            # elements in each i-half
  elemratio_ihalf: 2000   # geometric, fine end at the junction

# Bias sweeps.  Ge has E_g = 0.661 eV and V_bi = 0.68 V, so the whole bias
# window sits 0.3-0.4 V below the silicon one.  The room sweep stops at 0.4 V:
# above about 0.43 V the idealised reference model exceeds the 0.1 K
# plausibility limit (docs/GERMANIUM_PARAMETERS.md, section 5).
sweeps:
  VF_iv:    "range(0,0.0125,0.5)"       # Study 1, 3, 4
  VF_room:  "range(0,0.0125,0.4)"       # Study 2
  dT_sink:  "range(-0.02,0.0025,0.02)"  # Study 2 parametric
  VF_reverse: "range(0,-0.025,-0.5)"    # check C8
  rtol: 1e-6
  profile_VF: [0.0, 0.3, 0.35, 0.4, 0.45]

# Operating point and check windows used by the smoke tests, the checks C1-C9,
# the figures and the report.
report:
  VF_report: 0.4                 # headline bias (above (Eg+3kT)/2q = 0.37 V, where V0 heats its ends)
  VF_fig5: [0.3, 0.35, 0.4]      # Fig. 5 curves
  J_smoke: [0.3, 30.0]           # A/cm^2, allowed J(VF_report) of V0 (stage 4)
  C2_VF_min: 0.2                 # energy balance checked for VF >= this
  C2_tol: 0.03                   # |eta_E - expected| allowed
  C3_VF: [0.1, 0.5]              # junction cooling must exist in this window
  C4_VF: [0.2, 0.4]              # junction-cooling magnitude window
  C5_VF: [0.3, 0.45]             # I-V benchmark window
  plausibility_limit: 0.1        # K; larger net cooling is flagged as a bug (C7)
